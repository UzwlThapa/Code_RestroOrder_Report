<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>RestroOrder Reports</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>body{padding:24px;background:#f7f7f9} .card{margin-bottom:20px}</style>
</head>
<body>
<div class="container">
  <h2 class="mb-4">RestroOrder Reports</h2>

  <div class="card p-3">
    <h5>IRD Nepal Sales Book / Sales Return Book</h5>
    <p class="text-muted small">Dates are BS (Bikram Sambat), dot-separated — e.g. 2082.04.01 — same format the existing sync service uses.</p>
    <div class="row g-2">
      <div class="col-auto"><label class="form-label">From (BS)</label><input id="irdFrom" class="form-control" placeholder="2082.04.01"></div>
      <div class="col-auto"><label class="form-label">To (BS)</label><input id="irdTo" class="form-control" placeholder="2082.04.30"></div>
    </div>
    <div class="mt-2 d-flex gap-2">
      <button class="btn btn-outline-secondary" onclick="downloadIrd('ird-sales-book')">Sales Book (.xlsx)</button>
      <button class="btn btn-outline-secondary" onclick="downloadIrd('ird-sales-return-book')">Sales Return Book (.xlsx)</button>
    </div>
  </div>

  <div class="card p-3">
    <h5>Sales Report</h5>
    <div class="row g-2">
      <div class="col-auto"><label class="form-label">From</label><input type="date" id="from" class="form-control"></div>
      <div class="col-auto"><label class="form-label">To</label><input type="date" id="to" class="form-control"></div>
      <div class="col-auto"><label class="form-label">Item</label><input id="item" class="form-control" placeholder="Momo"></div>
      <div class="col-auto"><label class="form-label">Cost Center</label><input id="costCenter" class="form-control" placeholder="Bar"></div>
      <div class="col-auto"><label class="form-label">Unit</label><input id="unit" class="form-control" placeholder="Plate"></div>
      <div class="col-auto"><label class="form-label">Rate min</label><input id="rateMin" class="form-control" type="number"></div>
      <div class="col-auto"><label class="form-label">Rate max</label><input id="rateMax" class="form-control" type="number"></div>
      <div class="col-auto"><label class="form-label">Table</label><input id="table" class="form-control" placeholder="T4"></div>
      <div class="col-auto"><label class="form-label">Payment Mode</label><input id="paymentMode" class="form-control" placeholder="Cash"></div>
    </div>
    <div class="mt-3 d-flex gap-2 flex-wrap">
      <button class="btn btn-primary" onclick="preview()">Preview</button>
      <button class="btn btn-success" onclick="download('sales/export')">Export Filtered Sales Report (.xlsx)</button>
      <button class="btn btn-success" onclick="download('materialized/export')">Export Materialized Report (.xlsx)</button>
    </div>
    <div class="mt-3 input-group" style="max-width:460px">
      <input id="ownerEmail" class="form-control" placeholder="owner@email.com">
      <select id="emailReportType" class="form-select">
        <option value="sales">Sales Report (filtered)</option>
        <option value="materialized">Materialized Report</option>
      </select>
      <button class="btn btn-dark" onclick="emailReport()">Email to Owner</button>
    </div>
  </div>

  <div class="table-responsive">
    <table class="table table-sm table-striped bg-white" id="resultTable"></table>
  </div>
</div>

<script>
function filterParams() {
  const p = new URLSearchParams();
  p.set('from', document.getElementById('from').value);
  p.set('to', document.getElementById('to').value);
  ['item','costCenter','unit','rateMin','rateMax','table','paymentMode'].forEach(id => {
    const v = document.getElementById(id).value;
    if (v) p.set(id, v);
  });
  return p;
}

async function preview() {
  const res = await fetch('/api/reports/sales?' + filterParams());
  renderTable(await res.json());
}

function renderTable(rows) {
  const table = document.getElementById('resultTable');
  if (!rows.length) { table.innerHTML = '<tr><td>No rows for this filter.</td></tr>'; return; }
  const cols = Object.keys(rows[0]);
  table.innerHTML = '<thead><tr>' + cols.map(c => `<th>${c}</th>`).join('') + '</tr></thead>' +
    '<tbody>' + rows.map(r => '<tr>' + cols.map(c => `<td>${r[c] ?? ''}</td>`).join('') + '</tr>').join('') + '</tbody>';
}

function download(path) { window.location = '/api/reports/' + path + '?' + filterParams(); }

function downloadIrd(path) {
  const p = new URLSearchParams();
  p.set('from', document.getElementById('irdFrom').value);
  p.set('to', document.getElementById('irdTo').value);
  window.location = '/api/reports/' + path + '?' + p;
}

async function emailReport() {
  const reportType = document.getElementById('emailReportType').value;
  const toEmail = document.getElementById('ownerEmail').value;
  const body = {
    reportType, toEmail,
    from: document.getElementById('from').value,
    to: document.getElementById('to').value,
    item: document.getElementById('item').value || null,
    costCenter: document.getElementById('costCenter').value || null,
    unit: document.getElementById('unit').value || null,
    table: document.getElementById('table').value || null,
    paymentMode: document.getElementById('paymentMode').value || null
  };
  const res = await fetch('/api/reports/email', {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body)
  });
  alert(res.ok ? 'Sent to ' + toEmail : 'Failed to send — check SMTP settings.');
}
</script>
</body>
</html>
